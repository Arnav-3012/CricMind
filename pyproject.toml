[project]
name = "cricmind"
version = "0.1.0"
description = "T20 player archetypes from Cricsheet ball-by-ball data, an archetype matchup table and a tool-using agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "pandas",
    "pyarrow",
    "scikit-learn>=1.9.1",
    "torch",  # D-038(9): cric2vec MLP + embeddings
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest",
    "ruff",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
